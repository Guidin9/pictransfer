# cargo-deny: licenses, bans, sources and advisories (threat model T11).
[graph]
all-features = false
# Only the targets we ship or test on.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
    "x86_64-linux-android",
    "x86_64-unknown-linux-gnu",
]

[licenses]
# GPL-3.0-or-later compatible licenses only (ADR 0006).
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
ignore = [
    # `paste` is unmaintained (not a vulnerability). It is a compile-time proc-macro
    # pulled in only by netlink-packet-* via iroh's netwatch on Linux/Android.
    # Revisit when iroh/netwatch drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build-time only, via iroh netwatch" },
]
