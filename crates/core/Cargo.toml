[package]
name = "warpshot-core"
description = "Warpshot protocol, crypto, membership log, pairing and transfers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
sha2 = "0.11"
subtle = "2.6"
x-wing = { version = "0.1.1", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
