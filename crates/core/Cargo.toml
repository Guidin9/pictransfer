[package]
name = "warpshot-core"
description = "Warpshot protocol, crypto, membership log, pairing and transfers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8", default-features = false, features = ["std"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
subtle = "2.6"
x-wing = { version = "0.1.1", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "fs", "rt-multi-thread"] }
