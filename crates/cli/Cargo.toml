[package]
name = "warpctl"
description = "Headless Warpshot peer for end-to-end tests and spikes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
warpshot-core = { path = "../core" }
zeroize = "1.8"
